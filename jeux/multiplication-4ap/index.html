@media(max-width:650px){.app{padding:0 12px 40px}header{padding:12px 0;min-height:92px}header .brand .logo{height:47px;width:47px;font-size:1.6rem}header .brand{font-size:.92rem}header .tools{width:100%;justify-content:space-between;padding-bottom:12px}.tinybtn{padding:8px 10px;font-size:.76rem}.fontset{padding:3px 6px}.hero{display:flex;flex-direction:column-reverse;border-radius:25px}.hero-art{height:270px;min-height:270px;width:100%;overflow:hidden}.hero-art .smart-board{display:none}.hero-art .halo{width:235px}.hero-art img{height:244px;width:215px;object-position:30% 55%;border-radius:40% 40% 25% 25%;margin-top:18px}.hero-copy{padding:13px 24px 35px;text-align:center}.hero .h1{font-size:2rem;margin:8px 0}.hero p{font-size:.85rem}.hero-cta,.hero-bottom{justify-content:center}.dash-grid,.tables-grid,.split-cards{grid-template-columns:1fr}.game-card{min-height:165px}.game-card:before{width:90px;height:90px}.question-card{padding:19px 15px;min-height:400px}.equation{font-size:2.5rem}.answers{gap:10px}.answer{min-height:68px;font-size:1.45rem}.playtop h2{font-size:1.14rem}.stat{font-size:.76rem;padding:8px}.side-panel{grid-template-columns:1fr}.side-panel .side-emoji{display:none}.side-panel .help-list{grid-column:1}.draw-box{gap:13px}.match-btn{font-size:.94rem;min-height:54px}.finish{padding:35px 20px}.progress-dashboard{grid-template-columns:repeat(2,1fr)}.big-actions .btn{width:100%}.float{font-size:2rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.table-eq:nth-child(2n){background:#fff}

function createQuestions(count,focus=null){const q=[];if(focus!==null){for(let x=0;x<11;x++)q.push({a:focus,b:x});while(q.length<count)q.push({a:focus,b:randi(0,10)});return shuffle(q).slice(0,count)}for(let i=0;i<=10;i++)q.push({a:i,b:randi(0,10)});while(q.length<count){const a=randi(0,10),b=randi(0,10);q.push({a,b})}return shuffle(q).slice(0,count)}
function matchQuestions(){const out=[];for(let g=0;g<6;g++){const seen=new Set();const subset=[];const guaranteed=Array.from({length:11},(_,a)=>a).filter(a=>a%6===g);for(const a of guaranteed){let b=randi(0,10),tries=0;while(seen.has(a*b)&&tries++<200)b=randi(0,10);if(!seen.has(a*b)){seen.add(a*b);subset.push({a,b})}}let tr=0;while(subset.length<5&&tr++<500){let a=randi(0,10),b=randi(0,10),v=a*b;if(seen.has(v))continue;seen.add(v);subset.push({a,b})}out.push(...shuffle(subset))}return out}
function distractors(correct,q,n=4){const candidates=new Set();const {a,b}=q;[a*(b+1),a*(b-1),(a+1)*b,(a-1)*b,correct+1,correct-1,correct+5,correct-5,correct+10,correct-10].forEach(x=>{if(x!==correct && x>=0 && x<=100)candidates.add(x)});let arr=shuffle([...candidates]);while(arr.length<n-1){let v=randi(0,100);if(v!==correct&&!arr.includes(v))arr.push(v)}return shuffle([correct,...arr.slice(0,n-1)])}

function renderMatch(){const group=Math.floor(state.index/5);const start=group*5;const list=state.questions.slice(start,start+5);state.group=list.map((q,local)=>({...q,local,global:start+local}));state.matched=[];state.selected=null;state.tries=0;const ops=state.group.map((q,i)=>`<button class="match-btn" id="op${i}" data-op="${i}" dir="ltr">${q.a}x${q.b}</button>`).join('');const vals=shuffle(state.group.map(q=>({...q,product:q.a*q.b})));state.matchAnswerOrder=vals.map(q=>q.product);const answers=vals.map((q,j)=>`<button class="match-btn" id="res${j}" data-res="${j}" dir="ltr">${q.product}</button>`).join('');$('questionArea').innerHTML=`<p class="match-hint">الخطوة 1: اضغط عملية الضرب ← الخطوة 2: اضغط ناتجها</p><div class="draw-box" id="drawBox"><svg class="link-layer" id="linkLayer" aria-hidden="true"></svg><div class="match-col" id="opCol">${ops}</div><div class="match-col" id="resCol">${answers}</div></div>`;$('feedback').className='feedback';$('feedback').textContent='اربط كل عملية بناتجها لتظهر خطوط النجاح 🌈';$('playActions').innerHTML='';$('triesText').textContent='المحاولات: 2';screen.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>selectOp(+b.dataset.op));screen.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>selectResult(+b.dataset.res));requestAnimationFrame(drawMatchLines)}
function selectOp(local){if(state.locked||state.matched.includes(local))return;state.selected=local;state.tries=0;$('triesText').textContent='المحاولات: 2';screen.querySelectorAll('[data-op]').forEach(x=>x.classList.toggle('active',Number(x.dataset.op)===local));const f=$('feedback');f.className='feedback';f.textContent='اختر الناتج المقابل للعملية المحددة.'}
function selectResult(idx){if(state.selected===null||state.locked)return;const op=state.group[state.selected];const button=$('res'+idx);if(button.disabled)return;state.tries++;if(op.a*op.b===state.matchAnswerOrder[idx]){playSound('ok');state.hits++;state.score+=state.tries===1?1:.5;if(state.tries===1)state.perfect++;celebrate(6);const local=state.selected;state.matched.push(local);$('op'+local).classList.add('correct');$('op'+local).classList.remove('active');button.classList.add('correct');$('op'+local).disabled=true;button.disabled=true;matchPaths.push({a:local,b:idx,color:'#1bb77b'});drawMatchLines();state.selected=null;state.index++;$('points').textContent=state.hits;$('progressNum').textContent=`السؤال ${Math.min(30,state.index+1)} / 30`;$('pBar').style.width=(state.index/30*100)+'%';$('feedback').className='feedback ok';$('feedback').textContent=`أحسنت! ${op.a}x${op.b}=${op.a*op.b}`;$('triesText').textContent='المحاولات: 2';if(state.matched.length>=5){state.locked=true;$('playActions').innerHTML=`<button class="btn btn-green" id="nextGroup">${state.index>=30?'🏆 النتيجة':'المجموعة التالية ←'}</button>`;$('nextGroup').onclick=advanceMatch;autoNext=setTimeout(advanceMatch,2300)} }else{playSound('bad');button.classList.add('wrong');setTimeout(()=>button.classList.remove('wrong'),500);$('feedback').className='feedback no';$('feedback').textContent='لا بأس! جرّب الناتج الصحيح مرة أخرى.';if(state.tries>=2){const rightIdx=state.matchAnswerOrder.indexOf(op.a*op.b);state.misses++;countError(op);matchPaths.push({a:state.selected,b:rightIdx,color:'#f1a53c'});$('op'+state.selected).classList.add('correct');$('op'+state.selected).classList.remove('active');$('res'+rightIdx).classList.add('correct');$('op'+state.selected).disabled=true;$('res'+rightIdx).disabled=true;state.matched.push(state.selected);state.selected=null;state.index++;drawMatchLines();$('points').textContent=state.hits;$('progressNum').textContent=`السؤال ${Math.min(30,state.index+1)} / 30`;$('pBar').style.width=(state.index/30*100)+'%';$('feedback').className='feedback neutral';$('feedback').textContent=`التصحيح: ${op.a}x${op.b}=${op.a*op.b}`;$('triesText').textContent='المحاولات: 2';if(state.matched.length>=5){state.locked=true;$('playActions').innerHTML=`<button class="btn btn-green" id="nextGroup">${state.index>=30?'🏆 النتيجة':'المجموعة التالية ←'}</button>`;$('nextGroup').onclick=advanceMatch;autoNext=setTimeout(advanceMatch,2400)}}else{$('triesText').textContent='المحاولات: 1'}}}
function drawMatchLines(){const svg=$('linkLayer'),wrap=$('drawBox');if(!svg||!wrap)return;const wb=wrap.getBoundingClientRect();const w=wb.width,h=wb.height;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.innerHTML=matchPaths.map(({a,b,color})=>{const op=$('op'+a),res=$('res'+b);if(!op||!res)return '';const or=op.getBoundingClientRect(),rr=res.getBoundingClientRect();const x1=or.right-wb.left,y1=or.top-wb.top+or.height/2,x2=rr.left-wb.left,y2=rr.top-wb.top+rr.height/2;return `<path d="M${x1} ${y1} C${x1+35} ${y1},${x2-35} ${y2},${x2} ${y2}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" opacity=".88"/>`}).join('')}
function advanceMatch(){if(state.view!=='play'||!state.locked)return;clearTimeout(autoNext);matchPaths=[];if(state.index>=30)finishMode();else renderPlay()}
function updateAdventure(correct=false){const mode=state.mode;if(mode==='train'){const el=$('trainAvatar');if(el)el.style.right=(7+Math.min(78,state.hits/15*78))+'%'}if(mode==='rocket'){const el=$('rocketAvatar');if(el)el.style.right=(8+Math.min(72,state.hits/15*72))+'%'}}
function finishMode(){clearTimers();state.view='finish';const total=TOTAL[state.mode],score=+((state.score/total)*10).toFixed(1),passed=score>=7;let best=store.bests[state.mode];if(best===undefined||score>best)store.bests[state.mode]=score;store.sessions++;save();if(passed){celebrate(44);if(state.mode==='train')playSound('train');else playSound('ok')}else playSound('click');const m=MODE[state.mode];swap(`<div class="finish"><div class="trophy">${passed?'🏆':'🌈'}</div><span class="kicker">${passed?'🎊 مهمة ناجحة!':'🌱 كل محاولة تقوّيك!'}</span><h1 class="h2" style="margin-top:22px">${passed?'لقد أحسنت يا بطل الضرب!':'أنت تتقدّم… واصل التدريب!'}</h1><div class="score-big">${score}<small>/10</small></div><div class="stars">${score>=9?'⭐⭐⭐':score>=7?'⭐⭐':score>=4?'⭐':'🌷'}</div><p class="result-line">${passed?'جميل! حصلت على 7/10 أو أكثر وأتممت التحدي بجدارة.':'الخطأ بداية التعلم. راجع بعض الجداول وحاول مرة أخرى وستتحسن نتيجتك.'}</p><div class="statstrip"><span>✅ إجابات صحيحة: ${state.hits} / ${total}</span><span>🎯 من أول محاولة: ${state.perfect}</span><span>🏅 أفضل نتيجة: ${store.bests[state.mode].toFixed(1)}/10</span></div>${state.mode==='train'&&passed?'<div class="champ">🚂 صفّارة القطار! وصلت إلى محطة الأبطال بنجاح!</div>':''}<div class="finish-actions"><button class="btn btn-primary" id="again">🔄 إعادة التحدي</button><button class="btn btn-white" id="games">🎮 ألعاب أخرى</button>${passed?'<button class="btn btn-orange" id="printCert">🖨️ شهادة إنجاز</button>':''}</div><section class="certificate" id="certificate"><h3>مدرسة ابن الهيثم</h3><p>المستوى الرابع ابتدائي • مادة الرياضيات</p><h1>شهادة إنجاز وتفوّق</h1><p>تُمنح هذه الشهادة للتلميذ(ة)</p><div class="certname" id="certName"></div><p>لتفوقه(ا) في لعبة «${safe(m.name)}»<br>بعد الحصول على نتيجة <strong dir="ltr">${score}/10</strong></p><p>رحلة الأبطال في عالم الضرب</p><p class="sign">تصميم وإعداد الأستاذ: محمد قسو</p></section></div>`);$('again').onclick=()=>startMode(state.mode,state.tableFocus);$('games').onclick=dashboard;if(passed)$('printCert').onclick=certificateDialog}
function certificateDialog(){const shade=document.createElement('div');shade.className='modalshade';shade.innerHTML=`<div class="modal"><h2>🎓 شهادة بطل الضرب</h2><p class="muted">أدخل اسم التلميذ أو التلميذة لطباعته في الشهادة. الاسم لا يُرسل إلى أي خادم.</p><label for="studentName">اسم المتعلم(ة)</label><input id="studentName" maxlength="60" placeholder="اكتب الاسم هنا"><div class="modalbuttons"><button class="btn btn-primary" id="doPrint">طباعة الشهادة</button><button class="btn btn-white" id="closeModal">إلغاء</button></div></div>`;document.body.appendChild(shade);$('closeModal').onclick=()=>shade.remove();shade.addEventListener('click',e=>{if(e.target===shade)shade.remove()});$('doPrint').onclick=()=>{const name=$('studentName').value.trim();if(!name){toast('المرجو إدخال اسم المتعلم(ة).');return}$('certName').textContent=name;shade.remove();window.print()};$('studentName').focus()}
function progressPage(){clearTimers();state.view='progress';let games=Object.entries(MODE).map(([id,obj])=>`<tr><td>${obj.icon} ${obj.name}</td><td dir="ltr">${store.bests[id]===undefined?'—':store.bests[id].toFixed(1)+'/10'}</td><td>${store.bests[id]>=7?'🏅 متقَن':store.bests[id]!==undefined?'🌱 قيد التعلم':'—'}</td><td><button class="tinybtn" data-go="${id}">العب</button></td></tr>`).join('');const all=Object.values(store.bests),good=all.filter(x=>x>=7).length;const err=Object.entries(store.errors).sort((a,b)=>b[1]-a[1]).slice(0,3);swap(`<div class="breadcrumb"><button class="tinybtn" id="backGames">❮ قائمة الألعاب</button><span class="kicker">🏆 لوحة إنجازاتي</span></div><h1 class="h2">تقدّمي في عالم الضرب</h1><p class="muted">تُحفظ أفضل نتائجك على هذا الجهاز فقط، دون حساب أو إنترنت.</p><div class="progress-dashboard section"><div class="progress-box"><b>${store.sessions}</b><span>مرات إنهاء الألعاب</span></div><div class="progress-box"><b>${all.length}</b><span>ألعاب تم تجربتها</span></div><div class="progress-box"><b>${good}</b><span>تحديات متقنة</span></div></div><section class="section"><h2 class="h2">🎯 أفضل نتائجي</h2><div style="overflow-x:auto"><table class="record-table"><thead><tr><th>اللعبة</th><th>أعلى نتيجة</th><th>المستوى</th><th>إعادة</th></tr></thead><tbody>${games}</tbody></table></div></section><div class="section note">💡 ${err.length?'أكثر الجداول احتياجاً للتدريب حسب أخطائك: '+err.map(([n])=>'جدول '+n).join('، ')+'.':'جرّب الألعاب أولاً كي تكتشف الجداول التي تحتاج إلى تدريب.'}</div><div class="big-actions"><button class="btn btn-primary" id="goDash">🎮 العودة إلى الألعاب</button></div>`);$('backGames').onclick=dashboard;$('goDash').onclick=dashboard;screen.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>startMode(x.dataset.go))}
$('homeBtn').onclick=startHero;$('progressBtn').onclick=progressPage;$('soundBtn').onclick=()=>{store.sound=!store.sound;save();updateSettings();if(store.sound)playSound('ok')};$('fontSize').value=String(store.font);document.documentElement.style.setProperty('--fs',store.font+'px');$('fontSize').onchange=e=>{store.font=+e.target.value;document.documentElement.style.setProperty('--fs',store.font+'px');save();if(state.mode==='match'&&state.view==='play')requestAnimationFrame(drawMatchLines)};
function updateSettings(){$('soundBtn').textContent=store.sound?'🔊 الصوت':'🔇 صامت'}updateSettings();window.addEventListener('resize',()=>{if(state.mode==='match'&&state.view==='play')requestAnimationFrame(drawMatchLines)});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('.modalshade'))document.querySelector('.modalshade').remove();if(state.view!=='play'||state.mode==='type'||state.mode==='match'||state.locked||e.target.tagName==='BUTTON')return;if(['1','2','3','4'].includes(e.key)){const opts=[...screen.querySelectorAll('.answer:not(:disabled)')];if(opts[+e.key-1])opts[+e.key-1].click()}});
startHero();
</script>
</body></html>
